<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slagbrødrene</title>
<meta name="description" content="Velg din favorittkarakter, og slåss mot vennene dine!">
<style>
  :root{--ink:#090b12;--paper:#f8f1dc;--muted:#a8acbd;--gold:#f6c65d}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 20% 15%,rgba(122,92,255,.18),transparent 28rem),radial-gradient(circle at 85% 80%,rgba(238,83,104,.13),transparent 30rem),#090b12}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.035) 4px)}
  main{width:min(1180px,calc(100% - 32px));padding:32px 0 40px;position:relative}
  .game{display:block;position:relative;border:1px solid #37394a;border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;background:#121522;box-shadow:0 22px 70px rgba(0,0,0,.34);transition:transform .18s,border-color .18s,box-shadow .18s}
  .game:hover,.game:focus-visible{transform:translateY(-4px);border-color:#777b98;box-shadow:0 30px 80px rgba(0,0,0,.5);outline:none}
  .scene{display:block;width:100%;aspect-ratio:2000/1058;object-fit:cover;background:#31346c}
  .details{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px 24px}
  h1{font-size:clamp(1.7rem,4.5vw,3rem);line-height:1;margin:0 0 8px;text-shadow:4px 4px 0 #33275b}
  .details p{margin:0;color:var(--muted);line-height:1.55;font-size:.95rem}
  .play{display:flex;align-items:center;gap:12px;flex:none;color:var(--gold);font-size:1rem}.play b{font-size:1.8rem;transition:transform .18s}.game:hover .play b{transform:translateX(6px)}
  .badge{position:absolute;top:16px;right:16px;padding:6px 9px;border:1px solid rgba(255,255,255,.25);background:rgba(8,9,15,.7);font-size:.7rem;border-radius:6px}
  @media(max-width:700px){main{padding-top:16px}.details{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<main>
  <a class="game" href="/brawl.html" aria-label="Spill Slagbrødrene">
    <img class="scene" src="/slagbrodrene.webp" alt="Tre karakterer slåss på plattformer i Slagbrødrene" width="2000" height="1058">
    <span class="badge">2–4 spillere</span>
    <div class="details">
      <div><h1>Slagbrødrene</h1><p>Velg din favorittkarakter, og slåss mot vennene dine!</p></div>
      <div class="play"><span>Spill</span><b>→</b></div>
    </div>
  </a>
</main>
</body>
</html>
